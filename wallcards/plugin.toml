id = "imhatsune/wallcards"
name = "Wallcards"
version = "0.5.0"
plugin_api = 16
author = "Imhatsune"
license = "MIT"
description = "A unified wallpaper manager for static images, video wallpapers (via gslapper), and Wallpaper Engine scenes (via waywallen-display)."
tags = ["desktop", "theming", "wallpaper", "video", "gslapper", "wallpaper-engine", "waywallen"]
dependencies = ["imagemagick", "gslapper", "ffmpeg"]

[[setting]]
key = "wallpaper_dir"
type = "folder"
label_key = "settings.wallpaper_dir.label"
description_key = "settings.wallpaper_dir.description"
default = "~/Imágenes/Wallpapers"

[[setting]]
key = "engine_wallpaper_dir"
type = "folder"
label_key = "settings.engine_wallpaper_dir.label"
description_key = "settings.engine_wallpaper_dir.description"
default = "~/.steam/steam/steamapps/workshop/content/431960"

[[setting]]
key = "waywallen_bin"
type = "string"
label_key = "settings.waywallen_bin.label"
description_key = "settings.waywallen_bin.description"
default = "~/.local/bin/waywallen-layer-shell"

[[setting]]
key = "card_height"
type = "int"
label_key = "settings.card_height.label"
description_key = "settings.card_height.description"
default = 230
min = 180
max = 340
step = 10

[[setting]]
key = "icon_color"
type = "color"
label_key = "settings.icon_color.label"
description_key = "settings.icon_color.description"
default = "none"

[[widget]]
id = "widget"
entry = "widget.luau"

[[shortcut]]
id = "shortcut"
entry = "shortcut.luau"

[[panel]]
id = "main"
entry = "panel.luau"
width = 1120
height = 360
placement = "floating"
position = "center"
dismiss_on_outside_click = true
keyboard_focus = "on_demand"
capture_keys = [
  "escape", "q", "j", "k", "h", "l", "r", "return", "space", "left", "right", "up", "down", "1", "2", "3", "f5"
]
